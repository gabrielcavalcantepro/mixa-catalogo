services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mixa
      POSTGRES_PASSWORD: mixa
      POSTGRES_DB: mixa_catalogo
    ports:
      - "5432:5432"
    volumes:
      - mixa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mixa -d mixa_catalogo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mixa_postgres_data:
